name: Odyssey IMAX Watcher

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes, UTC time (GitHub's cron always runs in UTC)
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab, for testing

permissions:
  contents: write            # needed so the workflow can commit the updated state file back

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run watcher
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python odyssey_imax_watcher.py

      - name: Save updated state back to the repo
        run: |
          git config user.name "odyssey-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add odyssey_imax_state.json
          git diff --staged --quiet || git commit -m "Update seen session ids"
          git push
